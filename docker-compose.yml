# KaamSathi local stack.
#   docker compose up -d db redis        # just Postgres + Redis for local dev (ports 5433 / 6380)
#   docker compose up -d                 # full backend stack
#   docker compose --profile s3 up -d minio minio-init   # optional S3 emulator (CONTRIBUTING.md "Local S3 with MinIO")
name: kaamsathi

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DATABASE_URL: postgres://kaamsathi:kaamsathi@db:5432/kaamsathi
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  DJANGO_DEBUG: "true"
  OTP_DEV_CODE: "123456"
  CELERY_TASK_ALWAYS_EAGER: "false"
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  # Local + CI E2E log the same demo phones in repeatedly: no OTP cooldown, generous limits.
  OTP_RESEND_COOLDOWN_SECONDS: "0"
  OTP_MAX_PER_HOUR: "1000"
  THROTTLE_OTP: 1000/hour

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaamsathi
      POSTGRES_USER: kaamsathi
      POSTGRES_PASSWORD: kaamsathi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaamsathi -d kaamsathi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      <<: *backend-env
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional S3-compatible object storage for local testing of the S3 media path (profile "s3").
  # API http://localhost:9000 · console http://localhost:9001 (kaamsathi / kaamsathi-secret).
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kaamsathi
      MINIO_ROOT_PASSWORD: kaamsathi-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the media buckets once MinIO is healthy (idempotent).
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kaamsathi kaamsathi-secret &&
      mc mb --ignore-existing local/kaamsathi-media &&
      mc mb --ignore-existing local/kaamsathi-private
      "

volumes:
  pgdata:
  media:
  minio:
