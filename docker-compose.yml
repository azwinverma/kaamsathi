# KaamSathi local stack.
#   docker compose up -d db redis        # just Postgres + Redis for local dev (ports 5433 / 6380)
#   docker compose up -d                 # full backend stack
name: kaamsathi

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DATABASE_URL: postgres://kaamsathi:kaamsathi@db:5432/kaamsathi
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  DJANGO_DEBUG: "true"
  OTP_DEV_CODE: "123456"
  CELERY_TASK_ALWAYS_EAGER: "false"
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaamsathi
      POSTGRES_USER: kaamsathi
      POSTGRES_PASSWORD: kaamsathi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaamsathi -d kaamsathi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      <<: *backend-env
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
