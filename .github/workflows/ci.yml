name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kaamsathi
          POSTGRES_USER: kaamsathi
          POSTGRES_PASSWORD: kaamsathi
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kaamsathi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kaamsathi:kaamsathi@localhost:5433/kaamsathi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Translations compile (catches broken .po files)
        run: python manage.py compilemessages -l ne --ignore=.venv
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Production settings pass `check --deploy`
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-0f9c2d7e4b1a8c3f6e5d2b9a7c4e1f8a3b6d9c2e5f8a1b4c7d0e3f6a9b2c5d8e
          DJANGO_ALLOWED_HOSTS: api.example.com
      - run: pytest -q --cov=apps --cov-report=term-missing:skip-covered
      - name: OpenAPI schema (validated)
        run: python manage.py spectacular --file schema.yml --validate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Publish OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/schema.yml
          retention-days: 30
      - name: pip-audit (informational)
        continue-on-error: true
        run: pip install -q pip-audit && pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm messages:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: pnpm audit --prod (informational)
        continue-on-error: true
        run: pnpm audit --prod

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ------------------------------------------------------------------ security scans
  # bandit: Python SAST, fails on HIGH severity. gitleaks: secrets in the full git history
  # (allowlist in .gitleaks.toml). trivy: dependency CVEs + Dockerfile misconfig, fails on CRITICAL.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: bandit (fail on high severity)
        run: |
          pip install -q bandit
          bandit -r backend/apps backend/config -x '*/tests/*,*/migrations/*' --severity-level high
      - name: gitleaks (secret scan, full history)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner -v
      - name: trivy filesystem (dependencies + Dockerfiles, fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: nepal-workforce-os

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: kaamsathi-backend:ci
          build-args: RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          load: true
          tags: kaamsathi-web:ci
          build-args: NEXT_PUBLIC_SITE_URL=https://kaamsathi.example
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build backup image
        run: docker build -q -t kaamsathi-backup:ci deploy/backup
      - name: trivy image scan — backend (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: kaamsathi-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy image scan — web (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: kaamsathi-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Validate production compose file
        run: |
          sed -e 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=x/' -e 's/^JWT_SIGNING_KEY=.*/JWT_SIGNING_KEY=x/' \
              -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=x/' -e 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=x/' \
              deploy/.env.prod.example > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f deploy/docker-compose.prod.yml config --quiet

  # ------------------------------------------------------------------ end-to-end (Playwright + axe)
  # Full docker-compose stack (dev settings: OTP code 123456), seeded demo data, Chromium.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp -n .env.example .env || true
          docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8000/api/v1/readiness >/dev/null && exit 0
            sleep 2
          done
          docker compose logs --tail=200 backend
          exit 1
      - name: Seed demo data
        run: docker compose exec -T backend python manage.py seed_demo
      - name: Wait for the web app
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          docker compose logs --tail=200 web
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm e2e:install
      - name: Playwright (E2E + accessibility)
        working-directory: web
        env:
          BASE_URL: http://localhost:3000
          CI: "true"
        run: pnpm e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=300 backend web
