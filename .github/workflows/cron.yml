# Backup timer for the serverless scheduler (docs/deploy/VERCEL_FREE.md). The primary timer is
# cron-job.org every 5 min; this one only catches up if that stops. Runs are idempotent
# (apps/core/cron.py claims each job), so overlapping timers never run a job twice.
# Needs repo secret CRON_SECRET and repo variable API_URL (e.g. https://kaamsathi-api.vercel.app/api/v1).
# Every 30 min keeps a private repo inside the free 2,000 Actions minutes.
name: scheduler-tick

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Skip until configured
        if: env.CRON_SECRET == '' || env.API_URL == ''
        run: echo "CRON_SECRET / API_URL not set; nothing to do."
      - name: Run due jobs
        if: env.CRON_SECRET != '' && env.API_URL != ''
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${API_URL%/}/internal/cron"
