<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">Woman welder in a training booth lifting her welding helmet after a test weld</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#0F172A" fill-opacity=".09"/></pattern>
  </defs>
  <rect width="480" height="360" fill="#F0FDFA"/>
  <rect x="0" y="0" width="200" height="360" fill="url(#dots)"/>
  <!-- welding booth curtain -->
  <rect x="330" y="0" width="150" height="300" fill="#14B8A6" fill-opacity=".55"/>
  <path d="M352 0v300M378 0v300M404 0v300M430 0v300M456 0v300" stroke="#0F766E" stroke-opacity=".35" stroke-width="3"/>
  <path d="M330 0h150" stroke="#0F172A" stroke-width="6"/>
  <!-- extraction hood -->
  <path d="M40 0v34l30 24h60l30-24V0z" fill="#CBD5E1" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>

  <!-- welder -->
  <rect x="120" y="148" width="106" height="140" rx="28" fill="#C2410C"/>
  <path d="M173 160v120" stroke="#0F172A" stroke-opacity=".25" stroke-width="3"/>
  <rect x="162" y="128" width="22" height="26" fill="#6B4430"/>
  <circle cx="173" cy="108" r="32" fill="#6B4430"/>
  <!-- cap under the helmet -->
  <path d="M141 104a32 30 0 0 1 64 0z" fill="#0F766E"/>
  <!-- helmet headgear band + shield flipped UP (PPE: outlined) -->
  <path d="M140 108c10 6 56 6 66 0" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 100c-2-30 18-52 50-54 22-1 34 8 36 20l-6 26c-20-12-50-8-80 8z" fill="#334155" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <rect x="164" y="62" width="34" height="14" rx="3" transform="rotate(-12 181 69)" fill="#FBBF24" fill-opacity=".8" stroke="#0F172A" stroke-width="3"/>
  <!-- left arm lifting the helmet -->
  <path d="M128 170c-14-16-14-48 6-72" stroke="#C2410C" stroke-width="26" stroke-linecap="round" fill="none"/>
  <!-- right arm holding the MIG torch -->
  <path d="M220 172c18 18 30 40 38 58" stroke="#C2410C" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- bench -->
  <g stroke="#0F172A" stroke-width="3" stroke-linejoin="round">
    <rect x="40" y="252" width="410" height="18" fill="#334155"/>
    <path d="M70 270v90M420 270v90" stroke-width="8" stroke-linecap="round"/>
    <rect x="248" y="236" width="98" height="16" fill="#CBD5E1"/>
    <path d="M258 236c6-5 10 5 16 0s10 5 16 0 10 5 16 0" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
    <!-- MIG torch + cable -->
    <path d="M300 238c40 0 70 40 120 50" fill="none" stroke-width="6" stroke-linecap="round"/>
    <path d="M262 232l36 8" stroke-width="10" stroke-linecap="round"/>
    <path d="M298 240l12 3" stroke="#CBD5E1" stroke-width="7" stroke-linecap="round"/>
    <!-- leather gauntlets (PPE) -->
    <circle cx="258" cy="232" r="16" fill="#CBD5E1"/>
    <circle cx="140" cy="86" r="16" fill="#CBD5E1"/>
  </g>
  <!-- cooling sparks (small, not decorative sparkle) -->
  <circle cx="320" cy="226" r="3" fill="#FBBF24"/>
  <circle cx="332" cy="216" r="2" fill="#FBBF24"/>
  <circle cx="314" cy="212" r="2" fill="#FF6B6B"/>
</svg>
