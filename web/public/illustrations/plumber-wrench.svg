<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="t">
  <title id="t">Plumber tightening a pipe joint with a pipe wrench below a rooftop water tank</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#0F172A" fill-opacity=".09"/></pattern>
  </defs>
  <rect width="400" height="500" fill="#EFF6FF"/>
  <rect x="0" y="0" width="400" height="220" fill="url(#dots)"/>
  <g transform="translate(-40 -66) scale(1.24)">
  <!-- neighbouring rooftops -->
  <path d="M0 250h60v-60h50v40h40v20" fill="#DBEAFE"/>
  <rect x="0" y="430" width="420" height="70" fill="#CBD5E1"/>
  <path d="M0 430h420" stroke="#0F172A" stroke-width="3"/>

  <!-- rooftop water tank (object: outlined) -->
  <g stroke="#0F172A" stroke-width="3" stroke-linejoin="round">
    <rect x="236" y="84" width="140" height="176" rx="22" fill="#0F172A"/>
    <path d="M240 128h132M240 172h132M240 216h132" stroke="#334155" stroke-width="4"/>
    <ellipse cx="306" cy="84" rx="40" ry="10" fill="#334155"/>
    <rect x="252" y="260" width="12" height="28" fill="#5A6679"/>
    <rect x="348" y="260" width="12" height="28" fill="#5A6679"/>
    <rect x="200" y="288" width="190" height="10" fill="#5A6679"/>
    <!-- pipes -->
    <rect x="292" y="256" width="18" height="86" fill="#E2E8F0"/>
    <rect x="34" y="324" width="276" height="18" fill="#E2E8F0"/>
    <rect x="286" y="318" width="30" height="30" rx="5" fill="#CBD5E1"/>
    <rect x="216" y="318" width="26" height="30" rx="4" fill="#CBD5E1"/>
    <path d="M229 318v-12" stroke-width="4"/>
    <circle cx="229" cy="300" r="12" fill="none" stroke="#FF6B6B" stroke-width="6"/>
    <rect x="140" y="320" width="20" height="26" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- plumber -->
  <path d="M110 350l-4 92M146 350l6 92" stroke="#334155" stroke-width="34" stroke-linecap="round"/>
  <rect x="82" y="434" width="46" height="18" rx="9" fill="#0F172A"/>
  <rect x="132" y="434" width="46" height="18" rx="9" fill="#0F172A"/>
  <rect x="78" y="212" width="100" height="140" rx="26" fill="#14B8A6"/>
  <rect x="117" y="194" width="22" height="24" fill="#8D5A3B"/>
  <circle cx="128" cy="170" r="34" fill="#8D5A3B"/>
  <path d="M95 166a33 33 0 0 1 66 0z" fill="#0F172A"/>
  <path d="M92 160a36 30 0 0 1 72 0h20a4 4 0 0 1 0 8H92z" fill="#2563EB" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <!-- pipe re-drawn in front of the legs -->
  <rect x="34" y="324" width="190" height="18" fill="#E2E8F0" stroke="#0F172A" stroke-width="3"/>
  <rect x="140" y="320" width="20" height="26" rx="3" fill="#CBD5E1" stroke="#0F172A" stroke-width="3"/>
  <!-- arms -->
  <path d="M168 232c14 10 22 22 30 30" stroke="#0F766E" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M90 232c-4 34 30 56 82 62" stroke="#0F766E" stroke-width="26" stroke-linecap="round" fill="none"/>
  <!-- pipe wrench (tool: outlined) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M154 318l48-62" stroke="#0F172A" stroke-width="17"/>
    <path d="M154 318l48-62" stroke="#FF6B6B" stroke-width="10"/>
    <path d="M138 314h30l4 10h-38zM136 348h28" fill="#5A6679" stroke="#0F172A" stroke-width="3"/>
    <path d="M136 312v40" stroke="#0F172A" stroke-width="6"/>
  </g>
  <g stroke="#0F172A" stroke-width="3">
    <circle cx="200" cy="262" r="14" fill="#334155"/>
    <circle cx="174" cy="292" r="14" fill="#334155"/>
  </g>
  </g>
  <circle cx="58" cy="104" r="7" fill="#2563EB"/>
  <circle cx="74" cy="90" r="4" fill="#2563EB"/>
</svg>
