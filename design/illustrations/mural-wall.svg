<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">A painted street mural on a brick wall: a hand holding a wrench and a rising five-rung ladder</title>
  <defs>
    <pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 19.5h40M20 0v10M0 10h40M40 10v10M0 10v10" stroke="#C2410C" stroke-opacity=".3" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="wdots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#FFFFFF" fill-opacity=".16"/></pattern>
    <pattern id="tiles" width="28" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 13.5h28M14 0v7M0 7h28M28 7v7M0 7v7" stroke="#5A6679" stroke-opacity=".45" stroke-width="2" fill="none"/>
    </pattern>
  </defs>
  <!-- wall -->
  <rect width="480" height="300" fill="#FFF1F1"/>
  <rect width="480" height="300" fill="url(#brick)"/>
  <!-- painted panel with a hand-cut edge -->
  <path d="M34 34c80-8 330-12 414-2 6 70 4 160-2 226-120 8-300 8-410 0-8-70-8-150-2-224z" fill="#2563EB"/>
  <path d="M34 34c80-8 330-12 414-2 6 70 4 160-2 226-120 8-300 8-410 0-8-70-8-150-2-224z" fill="url(#wdots)"/>
  <circle cx="142" cy="130" r="78" fill="#4F46E5"/>
  <!-- coral brush swoosh -->
  <path d="M60 222c60-30 130-34 200-14 40 12 70 10 96-4" fill="none" stroke="#FF6B6B" stroke-width="16" stroke-linecap="round"/>
  <circle cx="374" cy="194" r="6" fill="#FF6B6B"/>
  <circle cx="388" cy="182" r="3.5" fill="#FF6B6B"/>
  <!-- painted hand holding a wrench (outlined like every tool in the kit) -->
  <g stroke="#0F172A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M104 200c-4-30 2-60 20-74l42-6c14 0 16 16 4 20l-22 4 40-4c14 0 14 18 0 20l-36 4 32 0c12 0 12 16 0 18l-30 2 22 2c10 2 8 16-2 16l-50 2z" fill="#B07A52"/>
    <path d="M150 120l60-62" stroke-width="16"/>
    <path d="M150 120l60-62" stroke="#FBBF24" stroke-width="10"/>
    <path d="M206 48c10-10 28-8 32 4l-12 4-4 10 10 6c-6 12-24 14-32 6z" fill="#FBBF24"/>
  </g>
  <!-- painted skill ladder -->
  <g stroke="#0F172A" stroke-width="3">
    <rect x="292" y="176" width="26" height="40" rx="4" fill="#F1F5F9"/>
    <rect x="324" y="152" width="26" height="64" rx="4" fill="#CCFBF1"/>
    <rect x="356" y="128" width="26" height="88" rx="4" fill="#14B8A6"/>
    <rect x="388" y="104" width="26" height="112" rx="4" fill="#FFFFFF"/>
    <rect x="420" y="78" width="20" height="138" rx="4" fill="#FBBF24"/>
  </g>
  <!-- pavement: stone tiles -->
  <rect y="300" width="480" height="60" fill="#CBD5E1"/>
  <rect y="300" width="480" height="60" fill="url(#tiles)"/>
  <path d="M0 300h480" stroke="#0F172A" stroke-width="3"/>
  <!-- paint tin + roller left by the artists -->
  <g stroke="#0F172A" stroke-width="3" stroke-linejoin="round">
    <rect x="388" y="306" width="36" height="34" rx="4" fill="#FBBF24"/>
    <path d="M388 314h36" />
    <path d="M436 340l10-40h18" fill="none" stroke-width="4" stroke-linecap="round"/>
    <rect x="446" y="292" width="30" height="12" rx="6" fill="#14B8A6"/>
  </g>
</svg>
