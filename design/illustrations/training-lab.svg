  <path d="M136 182c20 4 40-30 56-56" stroke="#4F46E5" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M54 182c-10 40-6 80 6 110" stroke="#4F46E5" stroke-width="24" stroke-linecap="round" fill="none"/>
  <circle cx="194" cy="122" r="12" fill="#6B4430"/>
  <circle cx="60" cy="296" r="12" fill="#6B4430"/>

