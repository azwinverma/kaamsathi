    <circle cx="301" cy="170" r="12" fill="#FBBF24"/>
    <rect x="296" y="156" width="10" height="6" fill="#334155"/>
    <path d="M250 200c10 0 14-6 14-14" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
    <rect x="150" y="250" width="190" height="14" fill="#334155"/>
    <path d="M170 264v52M320 264v52" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- instructor (left, pointing) -->
  <rect x="44" y="160" width="100" height="170" rx="26" fill="#4F46E5"/>
  <rect x="83" y="140" width="22" height="26" fill="#6B4430"/>
