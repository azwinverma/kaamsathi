  <rect y="316" width="480" height="44" fill="#CBD5E1"/>
  <path d="M0 316h480" stroke="#0F172A" stroke-width="3"/>

  <!-- practice wiring board (object: outlined) -->
  <g stroke="#0F172A" stroke-width="3" stroke-linejoin="round">
    <rect x="160" y="40" width="170" height="210" rx="4" fill="#FEF9E7"/>
    <path d="M190 80h110M190 80v120M300 80v60M190 200h60" fill="none" stroke="#5A6679" stroke-width="6" stroke-linecap="round"/>
