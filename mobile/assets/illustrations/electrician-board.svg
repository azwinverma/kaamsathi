        <rect x="302" y="186" width="16" height="34" rx="2"/>
        <rect x="320" y="186" width="16" height="34" rx="2"/>
        <rect x="338" y="186" width="16" height="34" rx="2"/>
        <rect x="248" y="248" width="16" height="34" rx="2"/>
        <rect x="266" y="248" width="16" height="34" rx="2"/>
        <rect x="284" y="248" width="16" height="34" rx="2"/>
        <rect x="302" y="248" width="34" height="34" rx="2"/>
