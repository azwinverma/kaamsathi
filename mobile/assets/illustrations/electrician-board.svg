    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#0F172A" fill-opacity=".09"/></pattern>
  </defs>
  <rect width="400" height="500" fill="#FFF1F1"/>
  <rect width="400" height="500" fill="url(#brick)"/>
  <circle cx="86" cy="96" r="70" fill="#FBBF24" fill-opacity=".35"/>
  <rect y="360" width="400" height="140" fill="url(#dots)"/>

  <g transform="translate(-52 -86) scale(1.4)">
